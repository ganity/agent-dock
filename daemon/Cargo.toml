[package]
name = "agent-dock-daemon"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent_dock_daemon"
path = "src/lib.rs"

[[bin]]
name = "agent-dock-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "ws"] }
flate2 = "1.1"
futures-util = "0.3"
uuid = { version = "1.18", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "time", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
